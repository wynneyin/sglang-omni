<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 864"><style>:root{--bg:#fafaf7;--ink:#1a1a1a;--muted:#6b6b6b;--line:#d8d2c4;--accent:#c4633f;--coord:#6b5b8a;--stage:#5b7a8a;--sched:#7a8a5b;--runner:#b87a5a;--gpu0:#d4e2ec;--cpu:#e6e3d8;--zmq:#a85e8a;--relay:#4a7a5e}*{box-sizing:border-box}svg{display:block;max-width:100%;height:auto}.box-coord{fill:#efebf5;stroke:var(--coord);stroke-width:2}.box-runner,.box-sched{stroke-width:1.5}.box-sched{fill:#ecefe3;stroke:var(--sched)}.box-runner{fill:#f5ebe3;stroke:var(--runner)}.box-cpu,.box-gpu0{stroke-width:1.5}.box-gpu0{fill:var(--gpu0);stroke:#5b8aa6}.box-cpu{fill:var(--cpu);stroke:#888}.box-client,.box-http{fill:#f7e8d8;stroke:#c47a3a;stroke-width:2}.box-http{fill:#ddd;stroke:#555}.box-user{fill:#fff;stroke:#888;stroke-width:1.5;stroke-dasharray:4 3}.label-title{font:600 13px sans-serif;fill:var(--ink)}.label-sub,.label-tiny{font:11px sans-serif;fill:var(--muted)}.label-tiny{font:10px sans-serif}.label-mono{font:10px &quot;SF Mono&quot;,Menlo,Consolas,monospace;fill:var(--ink)}.arrow-zmq{stroke:var(--zmq);stroke-width:1.8;fill:none;marker-end:url(#arrow-zmq)}.arrow-relay{stroke:var(--relay);stroke-width:2.5;fill:none;marker-end:url(#arrow-relay)}.arrow-flow{stroke:var(--accent);stroke-width:2;fill:none;marker-end:url(#arrow-flow)}.label-relay,.label-zmq{font:600 10px sans-serif}.label-zmq{fill:var(--zmq)}.label-relay{fill:var(--relay)}.layer-group{fill:rgba(0,0,0,.02);stroke:rgba(0,0,0,.1);stroke-width:1;stroke-dasharray:4 3}.layer-label{font:600 11px sans-serif;fill:var(--muted);letter-spacing:.08em;text-transform:uppercase}</style><g fill="#1a1a1a" font-family="sans-serif" font-size="12"><rect width="1020" height="50" x="20" y="8" fill="#fafaf7" stroke="#d8d2c4" rx="6"/><rect width="13" height="13" x="34" y="20" fill="#ddd" stroke="rgba(0,0,0,0.2)" rx="2"/><text x="52" y="31">HTTP</text><rect width="13" height="13" x="94" y="20" fill="#f7e8d8" stroke="rgba(0,0,0,0.2)" rx="2"/><text x="112" y="31">Client</text><rect width="13" height="13" x="167" y="20" fill="#efebf5" stroke="rgba(0,0,0,0.2)" rx="2"/><text x="185" y="31">Coordinator</text><rect width="13" height="13" x="273" y="20" fill="#e3eaef" stroke="rgba(0,0,0,0.2)" rx="2"/><text x="291" y="31">Stage</text><rect width="13" height="13" x="340" y="20" fill="#ecefe3" stroke="rgba(0,0,0,0.2)" rx="2"/><text x="358" y="31">Scheduler</text><rect width="13" height="13" x="433" y="20" fill="#f5ebe3" stroke="rgba(0,0,0,0.2)" rx="2"/><text x="451" y="31">ModelRunner</text><rect width="13" height="13" x="539" y="20" fill="#e6e3d8" stroke="rgba(0,0,0,0.2)" rx="2"/><text x="557" y="31">CPU</text><rect width="13" height="13" x="592" y="20" fill="#d4e2ec" stroke="rgba(0,0,0,0.2)" rx="2"/><text x="610" y="31">GPU 0</text><line x1="34" x2="56" y1="47" y2="47" stroke="#c4633f" stroke-width="2.5"/><text x="62" y="51">Request flow</text><line x1="159" x2="181" y1="47" y2="47" stroke="#a85e8a" stroke-width="2.5"/><text x="187" y="51">ZMQ (signals)</text><line x1="290" x2="312" y1="47" y2="47" stroke="#4a7a5e" stroke-width="2.5"/><text x="318" y="51">Relay (tensors)</text></g><g transform="translate(0,64)"><defs><marker id="arrow-zmq" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#a85e8a" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrow-relay" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#4a7a5e" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrow-flow" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#c4633f" d="M0,0 L10,5 L0,10 z"/></marker></defs><g><text x="20" y="30" class="layer-label">① Request lifecycle</text><rect width="220" height="680" x="20" y="50" class="layer-group" rx="8"/><rect width="160" height="55" x="50" y="80" class="box-user" rx="6"/><text x="130" y="103" class="label-title" text-anchor="middle">User</text><text x="130" y="121" class="label-sub" text-anchor="middle">&quot;Read this aloud&quot;</text><rect width="160" height="70" x="50" y="165" class="box-http" rx="6"/><text x="130" y="188" class="label-title" text-anchor="middle">HTTP API Server</text><text x="130" y="206" class="label-sub" text-anchor="middle">OpenAI-compatible</text><text x="130" y="223" class="label-mono" text-anchor="middle">POST /v1/audio/speech</text><rect width="160" height="65" x="50" y="265" class="box-client" rx="6"/><text x="130" y="287" class="label-title" text-anchor="middle">Client</text><text x="130" y="305" class="label-sub" text-anchor="middle">Protocol adapter</text><text x="130" y="321" class="label-tiny" text-anchor="middle">HTTP body → request</text><rect width="160" height="115" x="50" y="360" class="box-coord" rx="6"/><text x="130" y="382" class="label-title" text-anchor="middle">Coordinator</text><text x="130" y="399" class="label-sub" text-anchor="middle">Global router</text><text x="60" y="420" class="label-tiny">• Submit to entry stage</text><text x="60" y="434" class="label-tiny">• Listen for terminals</text><text x="60" y="448" class="label-tiny">• Merge multi-terminal</text><text x="60" y="462" class="label-tiny">• Broadcast abort</text><path d="M 130 135 L 130 163" class="arrow-flow"/><path d="M 130 235 L 130 263" class="arrow-flow"/><path d="M 130 330 L 130 358" class="arrow-flow"/><text x="130" y="510" class="label-sub" text-anchor="middle" style="font-style:italic">⇡ result returns</text><text x="130" y="525" class="label-sub" text-anchor="middle" style="font-style:italic">via same path</text><rect width="160" height="100" x="50" y="555" fill="#fff4d6" stroke="#d4b76a" stroke-width="1" rx="6"/><text x="130" y="575" class="label-title" text-anchor="middle" style="font-size:11px">Key observation</text><text x="56" y="594" class="label-tiny">This column is true</text><text x="56" y="607" class="label-tiny">linear hand-off. Each</text><text x="56" y="620" class="label-tiny">component holds the</text><text x="56" y="633" class="label-tiny">request and passes it</text><text x="56" y="646" class="label-tiny">to the next.</text><rect width="160" height="45" x="50" y="675" fill="#f5ebf2" stroke="#c89bb8" stroke-width="1" rx="6"/><text x="130" y="693" class="label-zmq" text-anchor="middle" style="font-size:10px">Abort: PUB/SUB</text><text x="130" y="708" class="label-tiny" text-anchor="middle">broadcast to all stages</text></g><g><path d="M 210 380 C 280 380, 320 130, 380 130" class="arrow-zmq"/><text x="265" y="180" class="label-zmq">SubmitMessage</text><text x="265" y="194" class="label-tiny" style="fill:var(--zmq)">(to entry stage)</text><path d="M 380 605 C 320 605, 280 440, 210 440" class="arrow-zmq" style="stroke-dasharray:4 3"/><text x="245" y="540" class="label-zmq">Completion</text><text x="245" y="554" class="label-tiny" style="fill:var(--zmq)">(from terminal)</text></g><g><text x="395" y="30" class="layer-label">② Three pipeline stages</text><rect width="660" height="680" x="380" y="50" class="layer-group" rx="8"/><g><rect width="620" height="170" x="400" y="75" class="box-cpu" rx="8"/><text x="415" y="97" class="label-title">Stage 1: preprocessing</text><text x="415" y="113" class="label-sub">CPU · entry stage</text><rect width="370" height="100" x="430" y="130" class="box-sched" rx="6"/><text x="445" y="150" class="label-title">ThreadedSimpleScheduler</text><text x="445" y="166" class="label-sub">Simple + thread pool</text><text x="445" y="184" class="label-mono">while not stopped:</text><text x="445" y="198" class="label-mono">msg = inbox.get()</text><text x="445" y="212" class="label-mono">executor.submit(fn, msg)</text><rect width="185" height="100" x="820" y="130" fill="#f7f3e8" stroke="#d4c890" stroke-width="1" rx="6"/><text x="912" y="150" class="label-title" text-anchor="middle" style="font-size:11px">What it does</text><text x="828" y="170" class="label-tiny">• Tokenize text</text><text x="828" y="184" class="label-tiny">• Build prompt</text><text x="828" y="198" class="label-tiny">• Non-AR</text><text x="828" y="212" class="label-tiny">• Output: token ids</text></g><g><path d="M 720 245 L 720 295" class="arrow-relay"/><text x="730" y="275" class="label-relay">Relay: payload (tensors)</text><path d="M 580 245 L 580 295" class="arrow-zmq"/><text x="480" y="275" class="label-zmq" text-anchor="end">ZMQ: DataReady</text></g><g><rect width="620" height="245" x="400" y="300" class="box-gpu0" rx="8"/><text x="415" y="322" class="label-title">Stage 2: tts_engine</text><text x="415" y="338" class="label-sub">GPU 0 · AR generation</text><rect width="370" height="180" x="430" y="355" class="box-sched" rx="6"/><text x="445" y="375" class="label-title">OmniScheduler</text><text x="445" y="391" class="label-sub">shared AR scheduler</text><text x="445" y="410" class="label-tiny">Reuses SGLang core: KV cache, batch,</text><text x="445" y="423" class="label-tiny">prefill/decode scheduling</text><rect width="340" height="90" x="445" y="436" class="box-runner" rx="5"/><text x="460" y="455" class="label-title" style="font-size:11px">FishS2ProModelRunner</text><text x="460" y="470" class="label-sub" style="font-size:10px">FeedbackARModelRunner + Fish callbacks</text><text x="460" y="488" class="label-mono">prepare_forward() ← write_fish_buffers</text><text x="460" y="503" class="label-mono">forward() ← text2semantic</text><text x="460" y="518" class="label-mono">post_forward() ← extract_fish_output</text><rect width="185" height="180" x="820" y="355" fill="#f7f3e8" stroke="#d4c890" stroke-width="1" rx="6"/><text x="912" y="375" class="label-title" text-anchor="middle" style="font-size:11px">What it does</text><text x="828" y="395" class="label-tiny">• Text → semantic codes</text><text x="828" y="409" class="label-tiny">• AR (token by token)</text><text x="828" y="423" class="label-tiny">• Uses KV cache</text><text x="828" y="445" class="label-tiny">callbacks.py provides:</text><text x="828" y="459" class="label-tiny">- write_fish_buffers</text><text x="828" y="473" class="label-tiny">- extract_fish_output</text><text x="828" y="487" class="label-tiny">- fish_prefill_forward</text><text x="828" y="509" class="label-tiny">• Output: audio codes</text></g><g><path d="M 720 545 L 720 595" class="arrow-relay"/><text x="730" y="575" class="label-relay">Relay: audio codes</text><path d="M 580 545 L 580 595" class="arrow-zmq"/><text x="480" y="575" class="label-zmq" text-anchor="end">ZMQ: DataReady</text></g><g><rect width="620" height="115" x="400" y="600" class="box-gpu0" rx="8"/><text x="415" y="622" class="label-title">Stage 3: vocoder</text><text x="415" y="638" class="label-sub">GPU 0 · terminal</text><rect width="370" height="55" x="430" y="650" class="box-sched" rx="6"/><text x="445" y="670" class="label-title">S2ProVocoderScheduler</text><text x="445" y="687" class="label-sub" style="font-size:10px">Specialized vocoder (not generic Simple)</text><text x="445" y="700" class="label-mono">DAC codec: codes → waveform</text><rect width="185" height="55" x="820" y="650" fill="#f7f3e8" stroke="#d4c890" stroke-width="1" rx="6"/><text x="912" y="670" class="label-title" text-anchor="middle" style="font-size:11px">What it does</text><text x="828" y="685" class="label-tiny">• Terminal stage</text><text x="828" y="699" class="label-tiny">• Outputs waveform</text></g></g></g></svg>