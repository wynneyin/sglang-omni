<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" font-family="'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" viewBox="0 0 920 470"><rect width="920" height="470" fill="#f4f6f9"/><rect width="896" height="446" x="12" y="12" fill="#fff" stroke="#e3e7ee" rx="16"/><text x="40" y="52" fill="#171b24" font-size="20" font-weight="700">The VRAM view: what DP costs, and what it buys</text><rect width="244" height="26" x="636" y="36" fill="none" stroke="#12a394" rx="13"/><text x="758" y="53" fill="#12a394" font-size="12.5" text-anchor="middle">Reader: why replicate weights?</text><g transform="translate(56,40)"><text x="20" y="40" fill="#5f6a79" font-size="12.5">One 80 GB H100 · schematic, not to scale</text><text x="20" y="78" fill="#171b24" font-size="13" font-weight="700">1 replica</text><rect width="600" height="34" x="140" y="60" fill="#eef1f5" stroke="#d7dce4" rx="6"/><rect width="52" height="34" x="140" y="60" fill="#5b6b9a" rx="6"/><rect width="330" height="34" x="192" y="60" fill="#deae54"/><text x="166" y="82" fill="#fff" font-size="11" text-anchor="middle">W</text><text x="357" y="82" fill="#4a3a12" font-size="12" text-anchor="middle">KV Cache (large)</text><text x="632" y="82" fill="#5f6a79" font-size="12" text-anchor="middle">free</text><text x="140" y="118" fill="#5f6a79" font-size="12">GPU compute used</text><rect width="300" height="14" x="270" y="106" fill="#ccd3dd" rx="7"/><rect width="87" height="14" x="270" y="106" fill="#12a394" rx="7"/><text x="580" y="117" fill="#171b24" font-size="12">≈29%</text><text x="20" y="176" fill="#171b24" font-size="13" font-weight="700">3 replicas</text><rect width="600" height="34" x="140" y="158" fill="#eef1f5" stroke="#d7dce4" rx="6"/><rect width="52" height="34" x="140" y="158" fill="#5b6b9a" rx="6"/><rect width="52" height="34" x="192" y="158" fill="#5b6b9a"/><rect width="52" height="34" x="244" y="158" fill="#5b6b9a"/><rect width="128" height="34" x="296" y="158" fill="#deae54"/><rect width="86" height="34" x="424" y="158" fill="#deae54"/><rect width="54" height="34" x="510" y="158" fill="#deae54"/><text x="218" y="180" fill="#fff" font-size="11" text-anchor="middle">W ×3</text><text x="360" y="180" fill="#4a3a12" font-size="11" text-anchor="middle">KV 1</text><text x="467" y="180" fill="#4a3a12" font-size="11" text-anchor="middle">KV 2</text><text x="537" y="180" fill="#4a3a12" font-size="10" text-anchor="middle">KV 3</text><text x="652" y="180" fill="#5f6a79" font-size="12" text-anchor="middle">free</text><text x="296" y="210" fill="#5f6a79" font-size="11.5">per-replica KV tokens: 97,503 · 53,149 · 20,961</text><text x="140" y="238" fill="#5f6a79" font-size="12">GPU compute used</text><rect width="300" height="14" x="270" y="226" fill="#ccd3dd" rx="7"/><rect width="195" height="14" x="270" y="226" fill="#12a394" rx="7"/><text x="580" y="237" fill="#171b24" font-size="12">higher</text><line x1="20" x2="740" y1="258" y2="258" stroke="#d7dce4"/><text x="20" y="280" fill="#171b24" font-size="13">DP <tspan fill="#5f6a79">does not save VRAM</tspan>: it copies weights ×N and splits the KV pool, reclaiming the idle compute above.</text></g><g fill="#5f6a79" font-size="12.5" transform="translate(40,356)"><rect width="13" height="13" x="0" y="0" fill="#5b6b9a" rx="3"/><text x="19" y="11">weights (replicated)</text><rect width="13" height="13" x="164" y="0" fill="#deae54" rx="3"/><text x="183" y="11">KV Cache (split, smaller each)</text><rect width="13" height="13" x="404" y="0" fill="#12a394" rx="3"/><text x="423" y="11">compute used</text><rect width="13" height="13" x="524" y="0" fill="#ccd3dd" rx="3"/><text x="543" y="11">idle</text></g><text x="40" y="392" fill="#5f6a79" font-size="13">A small model&apos;s weights are a modest slice of an 80 GB card, so two or three full replicas fit; each KV pool then gets smaller.</text><text x="40" y="414" fill="#5f6a79" font-size="13">It pays only when a tuned single replica was already leaving the GPU idle. On a compute-bound model</text><text x="40" y="436" fill="#5f6a79" font-size="13">(for example MOSS-TTS-Local at ≈81% util) the extra weight copies buy nothing.</text></svg>