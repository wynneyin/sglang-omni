<svg xmlns="http://www.w3.org/2000/svg" width="920" height="384" font-family="'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" viewBox="0 0 920 384"><rect width="920" height="384" fill="#f4f6f9"/><rect width="896" height="360" x="12" y="12" fill="#fff" stroke="#e3e7ee" rx="16"/><text x="40" y="52" fill="#171b24" font-size="20" font-weight="700">More host chains + MPS fill the idle GPU</text><g transform="translate(56,58)"><line x1="380" x2="380" y1="22" y2="186" stroke="#d7dce4" stroke-dasharray="4 5"/><text x="30" y="30" fill="#171b24" font-size="14" font-weight="700">1 replica</text><rect width="120" height="30" x="30" y="92" fill="#d5883a" rx="6"/><text x="90" y="112" fill="#fff" font-size="12.5" text-anchor="middle">host chain</text><path stroke="#5f6a79" stroke-width="1.5" marker-end="url(#a2)" d="M150 107 L178 107"/><rect width="28" height="28" x="184" y="44" fill="#12a394" rx="4"/><rect width="28" height="28" x="252" y="44" fill="#12a394" rx="4"/><rect width="28" height="28" x="218" y="78" fill="#12a394" rx="4"/><rect width="28" height="28" x="286" y="112" fill="#12a394" rx="4"/><rect width="28" height="28" x="184" y="146" fill="#12a394" rx="4"/><rect width="28" height="28" x="218" y="44" fill="#ccd3dd" rx="4"/><rect width="28" height="28" x="286" y="44" fill="#ccd3dd" rx="4"/><rect width="28" height="28" x="184" y="78" fill="#ccd3dd" rx="4"/><rect width="28" height="28" x="252" y="78" fill="#ccd3dd" rx="4"/><rect width="28" height="28" x="286" y="78" fill="#ccd3dd" rx="4"/><rect width="28" height="28" x="184" y="112" fill="#ccd3dd" rx="4"/><rect width="28" height="28" x="218" y="112" fill="#ccd3dd" rx="4"/><rect width="28" height="28" x="252" y="112" fill="#ccd3dd" rx="4"/><rect width="28" height="28" x="218" y="146" fill="#ccd3dd" rx="4"/><rect width="28" height="28" x="252" y="146" fill="#ccd3dd" rx="4"/><rect width="28" height="28" x="286" y="146" fill="#ccd3dd" rx="4"/><text x="184" y="196" fill="#5f6a79" font-size="12.5"><tspan fill="#171b24">SM Active ≈29%</tspan>, mostly idle</text><text x="410" y="30" fill="#171b24" font-size="14" font-weight="700">3 replicas + MPS</text><rect width="94" height="24" x="410" y="65" fill="#d5883a" rx="5"/><rect width="94" height="24" x="410" y="97" fill="#d5883a" rx="5"/><rect width="94" height="24" x="410" y="129" fill="#d5883a" rx="5"/><text x="457" y="81" fill="#fff" font-size="11" text-anchor="middle">core block 1</text><text x="457" y="113" fill="#fff" font-size="11" text-anchor="middle">core block 2</text><text x="457" y="145" fill="#fff" font-size="11" text-anchor="middle">core block 3</text><path stroke="#5f6a79" stroke-width="1.3" marker-end="url(#a2)" d="M504 77 L536 96"/><path stroke="#5f6a79" stroke-width="1.3" marker-end="url(#a2)" d="M504 109 L536 109"/><path stroke="#5f6a79" stroke-width="1.3" marker-end="url(#a2)" d="M504 141 L536 122"/><rect width="26" height="80" x="538" y="69" fill="#12a394" rx="5"/><text x="551" y="109" fill="#fff" font-size="12" text-anchor="middle" transform="rotate(-90 551 109)">MPS</text><path stroke="#5f6a79" stroke-width="1.5" marker-end="url(#a2)" d="M564 109 L590 109"/><rect width="28" height="28" x="596" y="44" fill="#12a394" rx="4"/><rect width="28" height="28" x="630" y="44" fill="#3cae7f" rx="4"/><rect width="28" height="28" x="664" y="44" fill="#2f8fb0" rx="4"/><rect width="28" height="28" x="698" y="44" fill="#ccd3dd" rx="4"/><rect width="28" height="28" x="596" y="78" fill="#3cae7f" rx="4"/><rect width="28" height="28" x="630" y="78" fill="#2f8fb0" rx="4"/><rect width="28" height="28" x="664" y="78" fill="#ccd3dd" rx="4"/><rect width="28" height="28" x="698" y="78" fill="#12a394" rx="4"/><rect width="28" height="28" x="596" y="112" fill="#2f8fb0" rx="4"/><rect width="28" height="28" x="630" y="112" fill="#12a394" rx="4"/><rect width="28" height="28" x="664" y="112" fill="#3cae7f" rx="4"/><rect width="28" height="28" x="698" y="112" fill="#ccd3dd" rx="4"/><rect width="28" height="28" x="596" y="146" fill="#ccd3dd" rx="4"/><rect width="28" height="28" x="630" y="146" fill="#ccd3dd" rx="4"/><rect width="28" height="28" x="664" y="146" fill="#12a394" rx="4"/><rect width="28" height="28" x="698" y="146" fill="#ccd3dd" rx="4"/><text x="596" y="196" fill="#5f6a79" font-size="12.5">more of the GPU is used</text></g><g fill="#5f6a79" font-size="12.5" transform="translate(40,296)"><rect width="13" height="13" x="0" y="0" fill="#12a394" rx="3"/><text x="19" y="11">kernels from the replicas</text><rect width="13" height="13" x="196" y="0" fill="#ccd3dd" rx="3"/><text x="215" y="11">idle SM</text><rect width="13" height="13" x="290" y="0" fill="#d5883a" rx="3"/><text x="309" y="11">host chain (own cores)</text></g><text x="40" y="336" fill="#5f6a79" font-size="13">Each replica is a full serving process with its own cores, so it adds an independent host chain.</text><text x="40" y="358" fill="#5f6a79" font-size="13">Without MPS the processes only time-slice; MPS lets their kernels co-reside on the SMs and use the idle compute.</text><defs><marker id="a2" markerHeight="7" markerWidth="7" orient="auto" refX="5" refY="3.2"><path fill="#5f6a79" d="M0 0 L6 3.2 L0 6 z"/></marker></defs></svg>