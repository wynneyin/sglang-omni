<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" font-family="'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" viewBox="0 0 920 430"><rect width="920" height="430" fill="#f4f6f9"/><rect width="896" height="406" x="12" y="12" fill="#fff" stroke="#e3e7ee" rx="16"/><text x="40" y="56" fill="#171b24" font-size="20" font-weight="700">The bottleneck is the host, not the GPU</text><rect width="204" height="26" x="676" y="38" fill="none" stroke="#12a394" rx="13"/><text x="778" y="55" fill="#12a394" font-size="12.5" text-anchor="middle">Reader: CPU or GPU?</text><g transform="translate(48,64)"><text x="0" y="56" fill="#5f6a79" font-size="13">CPU</text><text x="0" y="166" fill="#5f6a79" font-size="13">GPU</text><rect width="620" height="40" x="72" y="140" fill="#ccd3dd" rx="7"/><rect width="124" height="40" x="72" y="44" fill="#d5883a" rx="6"/><rect width="124" height="40" x="232" y="44" fill="#d5883a" rx="6"/><rect width="124" height="40" x="392" y="44" fill="#d5883a" rx="6"/><rect width="124" height="40" x="552" y="44" fill="#d5883a" rx="6"/><rect width="16" height="40" x="192" y="140" fill="#12a394" rx="3"/><rect width="16" height="40" x="352" y="140" fill="#12a394" rx="3"/><rect width="16" height="40" x="512" y="140" fill="#12a394" rx="3"/><rect width="16" height="40" x="672" y="140" fill="#12a394" rx="3"/><path stroke="#5f6a79" stroke-width="1.4" marker-end="url(#a1)" d="M196 84 L196 136"/><path stroke="#5f6a79" stroke-width="1.4" marker-end="url(#a1)" d="M356 84 L356 136"/><path stroke="#5f6a79" stroke-width="1.4" marker-end="url(#a1)" d="M516 84 L516 136"/><path stroke="#5f6a79" stroke-width="1.4" marker-end="url(#a1)" d="M676 84 L676 136"/><text x="290" y="165" fill="#5f6a79" font-size="12" text-anchor="middle">idle · waiting on host</text><line x1="72" x2="692" y1="200" y2="200" stroke="#d7dce4"/><text x="72" y="218" fill="#5f6a79" font-size="12.5">GPU idle ≈71% between kernels · <tspan fill="#171b24" font-weight="700">SM Active ≈29%</tspan></text><text x="72" y="240" fill="#5f6a79" font-size="12.5">cut GPU clock ×0.455 → throughput ×0.90 · cut host CPU to ¼ → throughput ×0.31</text></g><g fill="#5f6a79" font-size="12.5" transform="translate(40,332)"><rect width="13" height="13" x="0" y="0" fill="#d5883a" rx="3"/><text x="19" y="11">CPU busy (serial host work)</text><rect width="13" height="13" x="224" y="0" fill="#12a394" rx="3"/><text x="243" y="11">GPU kernel (≈3μs)</text><rect width="13" height="13" x="392" y="0" fill="#ccd3dd" rx="3"/><text x="411" y="11">GPU idle</text></g><text x="40" y="374" fill="#5f6a79" font-size="13">Each request&apos;s host work (scheduling, detok, sampling, output sync, stage handoff) runs serially in one process.</text><text x="40" y="398" fill="#5f6a79" font-size="13">Cutting GPU compute barely moves throughput; cutting host CPU drops it hard. The limit is the host (CPU) side.</text><defs><marker id="a1" markerHeight="7" markerWidth="7" orient="auto" refX="5" refY="3.2"><path fill="#5f6a79" d="M0 0 L6 3.2 L0 6 z"/></marker></defs></svg>